services:
  - type: web
    name: aroha-backend
    env: node
    region: singapore
    plan: free
    buildCommand: |
      corepack enable &&
      yarn install --immutable &&
      yarn build &&
      cp -f .env .medusa/server/.env.production 2>/dev/null || true &&
      cd .medusa/server && yarn install --production
    startCommand: cd .medusa/server && medusa start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MEDUSA_WORKER_MODE
        value: shared
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: MEDUSA_BACKEND_URL
        sync: false
      - key: STORE_CORS
        sync: false
      - key: ADMIN_CORS
        sync: false
      - key: AUTH_CORS
        sync: false
      - key: SANITY_PROJECT_ID
        value: plyu49lt
      - key: SANITY_DATASET
        value: production
      - key: SANITY_API_TOKEN
        sync: false
      - key: SANITY_STUDIO_URL
        sync: false
      - key: S3_ENDPOINT
        value: https://95650cd5dbeeb29cac30da01cedcf3a5.r2.cloudflarestorage.com/aroha
      - key: S3_BUCKET
        value: aroha
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: FILE_BASE_URL
        value: https://media.arohahouse.com/aroha
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: info@arohahouse.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
